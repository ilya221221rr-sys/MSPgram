# ============================================================
#  Сборка APK нативного Android-приложения MSPgram
#  Запуск: Actions → «Собрать Android-приложение» → Run workflow
#  Готовый APK появится в артефактах этого запуска (внизу страницы)
# ============================================================
name: Собрать Android-приложение
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Сборка debug-APK
        shell: bash
        run: |
          set -o pipefail
          gradle -p android assembleDebug --no-daemon 2>&1 | tee /tmp/build.log

      # ошибки компиляции → аннотации запуска (видны в API и вверху страницы Actions)
      - name: Ошибки сборки → аннотации
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|FAILURE: Build|What went wrong|Caused by" /tmp/build.log | head -60 | cut -c1-220 | while IFS= read -r line; do
            echo "::error ::$line"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: MSPgram-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
