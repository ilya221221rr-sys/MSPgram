# ============================================================
#  Сборка APK нативного Android-приложения MSPgram
#  Запуск: Actions → «Собрать Android-приложение» → Run workflow
#  Готовый APK появится в артефактах этого запуска (внизу страницы)
# ============================================================
name: Собрать Android-приложение
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Сборка debug-APK
        run: gradle -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MSPgram-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
