# ============================================================
#  MSPgram v24 «Auto Push» — включение серверного push в один клик
#  GitHub → вкладка Actions → «Включить push на сервере» → Run workflow
#
#  Что делает (всё сам, вручную ничего вставлять не нужно):
#   1. создаёт ключи VAPID (если их ещё нет) и секрет вебхука
#   2. записывает их в секреты Supabase Edge Functions
#   3. разворачивает функцию send-push (без Verify JWT)
#   4. применяет SQL: таблицы подписок, триггер на новые сообщения, диагностика
#   5. проверяет, что функция отвечает и ключи на месте
#
#  Нужен один секрет репозитория: SUPABASE_ACCESS_TOKEN
#   (supabase.com/dashboard/account/tokens → Generate new token →
#    GitHub: Settings → Secrets and variables → Actions → New repository secret)
# ============================================================
name: Включить push на сервере

on:
  workflow_dispatch:
    inputs:
      regenerate_vapid:
        description: 'Пересоздать VAPID-ключи (подписки всех устройств придётся создать заново)'
        type: boolean
        default: false

env:
  PROJECT_REF: xqjtycvfjamnqtkznyio
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверка токена Supabase
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error title=Нет токена::Добавь секрет репозитория SUPABASE_ACCESS_TOKEN (supabase.com/dashboard/account/tokens) — см. UPDATE-v24.md"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Секреты функции (VAPID + вебхук)
        run: |
          set -euo pipefail
          EXISTING="$(supabase secrets list --project-ref "$PROJECT_REF" -o json 2>/dev/null || echo '[]')"
          HAS_VAPID="$(echo "$EXISTING" | jq '[.[].name] | (index("VAPID_PUBLIC_KEY") != null) and (index("VAPID_PRIVATE_KEY") != null)' 2>/dev/null || echo false)"

          WH="$(openssl rand -hex 32)"
          echo "::add-mask::$WH"
          echo "WEBHOOK_SECRET=$WH" >> "$GITHUB_ENV"

          if [ "$HAS_VAPID" != "true" ] || [ "${{ inputs.regenerate_vapid }}" = "true" ]; then
            echo "Создаю новые VAPID-ключи"
            KEYS="$(npx --yes web-push@3.6.7 generate-vapid-keys --json)"
            PUB="$(echo "$KEYS" | jq -r .publicKey)"
            PRIV="$(echo "$KEYS" | jq -r .privateKey)"
            echo "::add-mask::$PRIV"
            supabase secrets set --project-ref "$PROJECT_REF" \
              VAPID_PUBLIC_KEY="$PUB" VAPID_PRIVATE_KEY="$PRIV" \
              VAPID_SUBJECT="https://${{ github.repository_owner }}.github.io/MSPgram/" \
              PUSH_WEBHOOK_SECRET="$WH"
          else
            echo "VAPID-ключи уже есть — оставляю как есть"
            supabase secrets set --project-ref "$PROJECT_REF" PUSH_WEBHOOK_SECRET="$WH"
          fi

      - name: Деплой функции send-push
        run: |
          supabase functions deploy send-push --project-ref "$PROJECT_REF" --no-verify-jwt --use-api

      - name: SQL — миграции и настройки
        run: |
          set -euo pipefail
          run_sql() {
            local body code
            body="$(mktemp)"
            code="$(jq -n --rawfile q "$1" '{query:$q}' | curl -sS -o "$body" -w '%{http_code}' \
              -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' -d @-)"
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              echo "::error title=SQL не выполнился ($1)::HTTP $code"
              cat "$body"; exit 1
            fi
            echo "OK: $1"
          }
          run_sql supabase/migration-11-webpush.sql
          run_sql supabase/migration-12-v23.sql
          printf "insert into public.push_settings (key, value) values ('function_url', 'https://%s.supabase.co/functions/v1/send-push'), ('webhook_secret', '%s') on conflict (key) do update set value = excluded.value;" \
            "$PROJECT_REF" "$WEBHOOK_SECRET" > /tmp/settings.sql
          run_sql /tmp/settings.sql

      - name: Проверка функции
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            R="$(curl -sS -X POST "https://$PROJECT_REF.supabase.co/functions/v1/send-push" \
                 -H 'Content-Type: application/json' -d '{"type":"vapid"}' || true)"
            echo "Ответ: $R"
            if echo "$R" | jq -e '.ready == true' >/dev/null 2>&1; then
              echo "✅ Серверный push включён. Теперь в приложении: Настройки → Push-уведомления → Включить."
              exit 0
            fi
            sleep 6
          done
          echo "::error title=Функция не отвечает::Проверь логи функции в Supabase (Edge Functions → send-push → Logs)"
          exit 1
