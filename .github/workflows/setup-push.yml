# ============================================================
#  MSPgram v24 «Auto Push» — исправленная версия (с диагностикой)
#  Файл: .github/workflows/setup-push.yml
#  Отличия от оригинала:
#   • токен очищается от пробелов/переводов строки и проверяется запросом к API Supabase
#   • ошибки supabase CLI больше не прячутся (убран 2>/dev/null)
#   • в логе красным пишется ПОНЯТНАЯ причина падения
#   • FIX: `supabase secrets set` теперь с --yes (в CI нет терминала для подтверждения)
#   • FIX: --project-ref заменён на --remote="REF" (именно со знаком =) в командах secrets
# ============================================================
name: Включить push на сервере
on:
  workflow_dispatch:
    inputs:
      regenerate_vapid:
        description: 'Пересоздать VAPID-ключи (подписки всех устройств придётся создать заново)'
        type: boolean
        default: false
env:
  PROJECT_REF: xqjtycvfjamnqtkznyio
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверка токена Supabase
        env:
          RAW_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$RAW_TOKEN" ]; then
            echo "::error title=Нет токена::Секрет SUPABASE_ACCESS_TOKEN не задан (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          TOKEN="$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]"'"'"'')"
          echo "::add-mask::$TOKEN"
          echo "Длина токена: ${#TOKEN}, начало: ${TOKEN:0:4}***"
          case "$TOKEN" in
            sbp_*) ;;
            *) echo "::error title=Неверный формат токена::Токен должен начинаться с sbp_ . Ты вставил не Access Token (возможно anon/service_role ключ или пароль). Создай токен на supabase.com/dashboard/account/tokens"; exit 1 ;;
          esac
          CODE="$(curl -sS -o /tmp/proj.json -w '%{http_code}' \
            "https://api.supabase.com/v1/projects/$PROJECT_REF" \
            -H "Authorization: Bearer $TOKEN")"
          echo "Supabase API ответил: HTTP $CODE"
          if [ "$CODE" = "401" ]; then
            echo "::error title=Токен недействителен (401)::Токен отозван/скопирован не полностью. Создай новый и обнови секрет."; exit 1
          elif [ "$CODE" = "403" ] || [ "$CODE" = "404" ]; then
            echo "::error title=Нет доступа к проекту ($CODE)::Токен создан в другом аккаунте Supabase, чем проект $PROJECT_REF."; cat /tmp/proj.json; exit 1
          elif [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
            echo "::error title=Ошибка API ($CODE)::"; cat /tmp/proj.json; exit 1
          fi
          echo "SUPABASE_ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "✅ Токен рабочий, проект найден"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Секреты функции (VAPID + вебхук)
        env:
          REGENERATE: ${{ inputs.regenerate_vapid }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/MSPgram/
        run: |
          set -euo pipefail
          supabase --version
          EXISTING="$(supabase secrets list --remote="$PROJECT_REF" -o json || echo '[]')"
          HAS_VAPID="$(echo "$EXISTING" | jq '[.[].name] | (index("VAPID_PUBLIC_KEY") != null) and (index("VAPID_PRIVATE_KEY") != null)' || echo false)"
          echo "VAPID-ключи уже есть: $HAS_VAPID"
          WH="$(openssl rand -hex 32)"
          echo "::add-mask::$WH"
          echo "WEBHOOK_SECRET=$WH" >> "$GITHUB_ENV"
          if [ "$HAS_VAPID" != "true" ] || [ "$REGENERATE" = "true" ]; then
            echo "Создаю новые VAPID-ключи"
            KEYS="$(npx --yes web-push@3.6.7 generate-vapid-keys --json)"
            PUB="$(echo "$KEYS" | jq -r .publicKey)"
            PRIV="$(echo "$KEYS" | jq -r .privateKey)"
            echo "::add-mask::$PRIV"
            supabase secrets set --remote="$PROJECT_REF" --yes \
              VAPID_PUBLIC_KEY="$PUB" VAPID_PRIVATE_KEY="$PRIV" \
              VAPID_SUBJECT="$SITE_URL" \
              PUSH_WEBHOOK_SECRET="$WH"
          else
            echo "VAPID-ключи уже есть — оставляю как есть"
            supabase secrets set --remote="$PROJECT_REF" --yes PUSH_WEBHOOK_SECRET="$WH"
          fi
      - name: Деплой функции send-push
        run: |
          supabase functions deploy send-push --remote="$PROJECT_REF" --no-verify-jwt --use-api --yes
      - name: SQL — миграции и настройки
        run: |
          set -euo pipefail
          run_sql() {
            local body code
            body="$(mktemp)"
            code="$(jq -n --rawfile q "$1" '{query:$q}' | curl -sS -o "$body" -w '%{http_code}' \
              -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' -d @-)"
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              echo "::error title=SQL не выполнился ($1)::HTTP $code"
              cat "$body"; exit 1
            fi
            echo "OK: $1"
          }
          run_sql supabase/migration-11-webpush.sql
          run_sql supabase/migration-12-v23.sql
          printf "insert into public.push_settings (key, value) values ('function_url', 'https://%s.supabase.co/functions/v1/send-push'), ('webhook_secret', '%s') on conflict (key) do update set value = excluded.value;" \
            "$PROJECT_REF" "$WEBHOOK_SECRET" > /tmp/settings.sql
          run_sql /tmp/settings.sql
      - name: Проверка функции
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            R="$(curl -sS -X POST "https://$PROJECT_REF.supabase.co/functions/v1/send-push" \
                 -H 'Content-Type: application/json' -d '{"type":"vapid"}' || true)"
            echo "Ответ: $R"
            if echo "$R" | jq -e '.ready == true' >/dev/null 2>&1; then
              echo "✅ Серверный push включён. Теперь в приложении: Настройки → Push-уведомления → Включить."
              exit 0
            fi
            sleep 6
          done
          echo "::error title=Функция не отвечает::Проверь логи функции в Supabase (Edge Functions → send-push → Logs)"
          exit 1
